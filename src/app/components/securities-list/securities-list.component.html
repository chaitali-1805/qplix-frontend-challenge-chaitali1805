<filterable-table
  class="security-list"
  [dataSource]="displayedSecurities()"
  [isLoading]="loading()"
  [filterConfig]="filterConfig()"
  (filterChange)="onFilterChange($event)"
>
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let security">{{ security.name }}</td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let security">{{ security.type }}</td>
  </ng-container>

  <ng-container matColumnDef="currency">
    <th mat-header-cell *matHeaderCellDef>Currency</th>
    <td mat-cell *matCellDef="let security">{{ security.currency }}</td>
  </ng-container>

  <!-- Custom row definitions to be provided to the wrapper table. -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  <!-- Row shown when there is no matching data that will be provided to the wrapper table. -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="3" class="text-center py-4">
      @if (loading()) {
        Loading...
      } @else {
        No matching securities found
      }
    </td>
  </tr>
</filterable-table>

<mat-paginator
  [length]="totalItems()"
  [pageSize]="pageSize()"
  [pageIndex]="pageIndex()"
  [pageSizeOptions]="[5, 10, 25, 50]"
  (page)="onPageChange($event)"
  showFirstLastButtons
  aria-label="Select page of securities"
></mat-paginator>
